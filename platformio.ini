; PlatformIO Project Configuration File
; MeteoHubSensor - Outdoor Sensor Node for MeteoHub
; Author: morfredus
;
; Cible unique : ESP32-S3 Super Mini (env esp32-s3). Le define SENSOR_BOARD_S3
; selectionne le brochage dans include/board_config.h. (La cible C3 HW-675 a ete
; retiree : on se concentre sur l'ESP32-S3 pour rester dans une seule famille.)

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D CORE_DEBUG_LEVEL=3
	-D PROJECT_NAME='"MeteoHubSensor"'
	; USB CDC pour la console Serial (HWCDC / USB-Serial-JTAG natif du S3 Mini).
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
	pre:scripts/version.py
lib_deps =
	adafruit/Adafruit AHTX0@^2.0.5
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit NeoPixel@^1.12.0

; --- ESP32-S3 Super Mini --------------------------------------------------
; Super Mini v0.2 : 4 Mo de flash + 2 Mo de PSRAM quad (AP Memory 3.3 V). Le
; firmware de la sonde ne se sert PAS de la PSRAM : on la laisse volontairement
; desactivee (-DBOARD_HAS_PSRAM retire), elle reste simplement inutilisee.
; Ne PAS passer a lolin_s3_mini : ce profil suppose une PSRAM OCTALE et ferait
; boucler le boot sur cette carte a PSRAM quad. memory_type = qio_qspi ci-dessous
; correspond au bon mode (flash QIO + PSRAM quad) si on voulait un jour l'activer.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_unflags =
	${env.build_unflags}
	-DBOARD_HAS_PSRAM
build_flags =
	${env.build_flags}
	-D SENSOR_BOARD_S3
