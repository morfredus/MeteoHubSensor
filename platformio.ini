; PlatformIO Project Configuration File
; MeteoHubSensor - Outdoor Sensor Node for MeteoHub
; Author: morfredus
;
; Deux cibles materielles, un seul firmware :
;   env supermini -> ESP32-S3 Super Mini (LED RGB seule, sans ecran)
;   env c3oled    -> ESP32-C3 HW-675 (0.42" OLED SSD1306 72x40 integre)
; Le define SENSOR_BOARD_* selectionne le brochage dans include/board_config.h.

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D CORE_DEBUG_LEVEL=3
	-D PROJECT_NAME='"MeteoHubSensor"'
	; USB CDC pour la console Serial. USB_MODE=1 = HWCDC (USB-Serial-JTAG),
	; commun au C3 et au S3 Super Mini ; sans lui, Serial n'est pas defini sur C3.
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
	pre:scripts/version.py
lib_deps =
	adafruit/Adafruit AHTX0@^2.0.5
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit NeoPixel@^1.12.0

; --- ESP32-S3 Super Mini (cible historique) --------------------------------
; Super Mini v0.2 : 4 Mo de flash + 2 Mo de PSRAM quad (AP Memory 3.3 V). Le
; firmware de la sonde ne se sert PAS de la PSRAM : on la laisse volontairement
; desactivee (-DBOARD_HAS_PSRAM retire), elle reste simplement inutilisee.
; Ne PAS passer a lolin_s3_mini : ce profil suppose une PSRAM OCTALE et ferait
; boucler le boot sur cette carte a PSRAM quad. memory_type = qio_qspi ci-dessous
; correspond au bon mode (flash QIO + PSRAM quad) si on voulait un jour l'activer.
[env:supermini]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_unflags =
	${env.build_unflags}
	-DBOARD_HAS_PSRAM
build_flags =
	${env.build_flags}
	-D SENSOR_BOARD_S3

; --- ESP32-C3 HW-675 (OLED 0.42" integre) ----------------------------------
; C3 generique 4 Mo. La liaison ESP-NOW avec le hub S3 exige une TX reduite
; (SENSOR_NEEDS_TX_LIMIT dans board_config.h). U8g2 pilote l'ecran 72x40.
[env:c3oled]
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
	${env.build_flags}
	-D SENSOR_BOARD_C3
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@^2.35.30
